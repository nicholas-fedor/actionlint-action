name: "actionlint-action"
description: "Lint GitHub Actions workflows using the official actionlint release binary."
author: "Nicholas Fedor"

inputs:
  version:
    description: |
      actionlint version to use (e.g. "1.7.12").
      Leave empty or omit to automatically use the latest release from GitHub.
    required: false
    default: ""

  working-directory:
    description: "Directory to run actionlint from (defaults to $GITHUB_WORKSPACE)"
    required: false
    default: ""

  github-token:
    description: |
      GitHub token to use when querying the GitHub API for the latest release.
      Recommended: use the default GITHUB_TOKEN or a PAT with 'public_repo' scope.
      Falls back to anonymous requests (lower rate limit) if not provided.
    required: false
    default: ""

  ignore:
    description: |
      Regular expression matching error messages to ignore. May be specified multiple
      times by separating patterns with newlines. Empty by default (no messages ignored).
    required: false
    default: ""

  shellcheck:
    description: |
      Command name or file path of the shellcheck executable. Set to an empty string
      to disable shellcheck integration. Defaults to "shellcheck".
    required: false
    default: "shellcheck"

  pyflakes:
    description: |
      Command name or file path of the pyflakes executable. Set to an empty string
      to disable pyflakes integration. Defaults to "pyflakes".
    required: false
    default: "pyflakes"

  oneline:
    description: "Use one line per error. Useful for parsing output from programs."
    required: false
    default: "false"

  format:
    description: |
      Custom Go template to format error messages. See actionlint documentation for
      available template variables and functions.
    required: false
    default: ""

  config-file:
    description: |
      File path to a config file. When set, overrides the default auto-discovery of
      .github/actionlint.yaml or .github/actionlint.yml.
    required: false
    default: ""

  no-color:
    description: "Disable colorful output."
    required: false
    default: "false"

  color:
    description: "Force colorful output even when not connected to a TTY."
    required: false
    default: "false"

  verbose:
    description: "Enable verbose log output."
    required: false
    default: "false"

  debug:
    description: "Enable debug output."
    required: false
    default: "false"

  stdin-filename:
    description: |
      File name used when reading input from stdin (-). Defaults to "<stdin>".
    required: false
    default: ""

  files:
    description: |
      Workflow file paths to lint, separated by whitespace. Use "-" to read from stdin.
      When empty, actionlint auto-discovers workflow files in .github/workflows/.
    required: false
    default: ""

runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: "check-circle"
  color: "green"
