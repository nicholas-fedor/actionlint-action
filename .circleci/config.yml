version: 2.1

executors:
  default:
    docker:
      - image: cimg/node:lts@sha256:907e03ea220172ca67bc14706907afa6df26d50298393b7e62f0a16fffe5f347
    working_directory: ~/project

commands:
  setup-and-install:
    steps:
      - checkout
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Install Dependencies
          command: |
            export PATH="$HOME/.bun/bin:$PATH"
            bun install

  verify-dependencies:
    steps:
      - run:
          name: Audit Dependencies
          command: |
            export PATH="$HOME/.bun/bin:$PATH"
            bun audit

  build-dist:
    steps:
      - run:
          name: Build Distribution Bundle
          command: |
            export PATH="$HOME/.bun/bin:$PATH"
            bun run build

jobs:
  test:
    executor: default
    steps:
      - setup-and-install
      - verify-dependencies
      - run:
          name: Run Tests with Coverage
          command: |
            export PATH="$HOME/.bun/bin:$PATH"
            bun test --coverage
      - run:
          name: Upload Coverage to Codecov
          command: |
            if [ -n "$CODECOV_TOKEN" ]; then
              curl -Os https://uploader.codecov.io/latest/linux/codecov
              chmod +x codecov
              ./codecov -t "$CODECOV_TOKEN" --dir ~/project/coverage
            else
              echo "CODECOV_TOKEN not set, skipping upload"
            fi


  test-pr:
    executor: default
    steps:
      - setup-and-install
      - verify-dependencies
      - run:
          name: Run Tests
          command: |
            export PATH="$HOME/.bun/bin:$PATH"
            bun test
      - build-dist

workflows:
  ci:
    jobs:
      - test:
          filters:
            branches:
              only: main
            tags:
              only: /.*/
      - test-pr:
          filters:
            branches:
              ignore: main
